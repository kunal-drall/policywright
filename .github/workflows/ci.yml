name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # D2.1: the JSON Schemas committed under schemas/mcp/ must be exactly
      # what src/mcp/schemas.ts defines (the server advertises the same in
      # tools/list — asserted by test/mcp.test.ts against the committed files).
      - name: MCP tool schemas match the committed copies
        run: npm run mcp:schemas -- --check

      # D2.2: the packaged skill validates against the agentskills.io
      # reference validator (the structural + walkthrough checks run in
      # `npm test`, test/skill.test.ts).
      - name: Skill package validates (skills-ref)
        run: npx --yes skills-ref@0.1.5 validate .claude/skills/policywright-grant

      - name: Demo (offline smoke test)
        run: npm run demo

      # D2.3: the dry-run reports committed for the REAL recorded claim→swap
      # sequence must be exactly what the harness prints today, in both modes
      # (argument constraints advisory → BLND→XLM flagged; enforced → denied).
      - name: Live dry-run reports (both modes) match the committed copies
        run: |
          npm run --silent cli -- simulate --input examples/live/recorded-claim-swap-fresh.json \
            | diff - examples/live/simulation-report.md
          npm run --silent cli -- simulate --input examples/live/recorded-claim-swap-fresh.json --constrain-arguments \
            | diff - examples/live/simulation-report.constrained.md
          echo "both committed reports are reproducible"

      # D2.4: the side-by-side artifacts for the same recording — the composed
      # spending_limit configuration and the generated FrequencyLimitPolicy —
      # must be exactly what synth emits today.
      - name: Live side-by-side artifacts (composed config + generated policy) match the committed copies
        run: |
          # synth.args pins the deploy-time facts (signer, deployed policy
          # addresses) the installable artifact was emitted with (D2.5).
          npm run --silent cli -- synth --input examples/live/recorded-claim-swap-fresh.json --out "$RUNNER_TEMP/fresh" $(cat examples/live/fresh/synth.args) > /dev/null
          cp examples/live/fresh/synth.args "$RUNNER_TEMP/fresh/"
          diff -r "$RUNNER_TEMP/fresh" examples/live/fresh
          echo "composed configuration and generated policy are reproducible"

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install docs-site dependencies
        run: npm ci
        working-directory: site

      - name: Build docs site
        run: npm run build
        working-directory: site

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      # rustup reads contracts/rust-toolchain.toml — channel 1.97.1,
      # target wasm32v1-none, components rustfmt + clippy.
      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      # Same pinned CLI version as the D1.3 deploy (FACTS.md §1.1); the
      # action ref selects the release binary to install.
      - name: Install stellar-cli
        uses: stellar/stellar-cli@v27.1.0

      - name: Build contract wasm with stellar-cli
        run: stellar contract build --package frequency-limit-policy

      # D2.5: the vendored OZ account and stock spending-limit wrapper build to
      # the hashes deployed on testnet (FACTS.md §14).
      - name: Build the vendored OZ account and spending-limit wrapper
        run: |
          stellar contract build --package multisig-account
          stellar contract build --package spending-limit-policy
          for pair in "multisig_account:1815dda1b96ea6d23865be8a16ffcbe0b8336d15fc0d3d5ada776c06cb17afde" \
                      "spending_limit_policy:5a45420db383bfc6166519780bdf54cda976f869e441e1a4d98666e4726cbec4"; do
            name=${pair%%:*}; expected=${pair##*:}
            built=$(sha256sum "target/wasm32v1-none/release/${name}.wasm" | cut -d' ' -f1)
            echo "${name}: built $built expected $expected"
            [ "$built" = "$expected" ] || { echo "::error::${name} wasm sha256 differs from the deployed hash"; exit 1; }
          done

      # Cross-platform reproducibility verified in run 30839117017 (Linux
      # x86_64 == macOS arm64 hash; FACTS.md §1.5) — asserted since then.
      - name: Assert built wasm hash equals the recorded reproducible build
        run: |
          built=$(sha256sum target/wasm32v1-none/release/frequency_limit_policy.wasm | cut -d' ' -f1)
          expected=42227f2b6150c95a7084bb7c5ff2e7a40793eae39bf0c5dc95bd752d18ee6eed
          echo "built:    $built"
          echo "expected: $expected (FACTS.md §1.5; equals the deployed on-chain wasm)"
          [ "$built" = "$expected" ] || { echo "::error::built wasm sha256 differs from the recorded reproducible hash"; exit 1; }
          echo "hash matches the recorded reproducible build and the deployed on-chain wasm"
